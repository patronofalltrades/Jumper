# Checks each pull request (TRD section 10): type check, lint and the Vitest tests, and the SQL tests.
# The SQL tests use a throwaway Postgres in the job, not Supabase, so the workflow needs no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Type check, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (Vitest)
        run: npm test

  # The SQL tests in supabase/tests/ (issue #137), with the Data isolation test (PLAN.md section 4, test 1).
  # They run on a throwaway Postgres 16 in the job, never on the live Supabase project, so no secrets are necessary.
  sql:
    name: SQL tests (row-level security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: SQL tests
        run: scripts/sql-tests.sh
